name: EarthShift CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:deployment
      - run: npm run build
        env:
          VERCEL: '1'
          # Reserved, non-resolving origin: build validation makes no network request.
          EARTHSHIFT_BACKEND_URL: https://backend.example.invalid
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          EARTHSHIFT_DEMO_MODE: 'false'
          EARTHSHIFT_PHENOMENA_AI_ENABLED: 'false'
